name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gpu-planning-dashboard-EiRKm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static syntax check (every JS module parses)
        run: |
          for f in js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
